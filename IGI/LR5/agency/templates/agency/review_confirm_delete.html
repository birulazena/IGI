{% extends 'agency/base.html' %}
{% block title %}Delete Review{% endblock %}

{% block content %}
    <h2>Are you sure you want to delete this review?</h2>
    <p>"{{ object.text }}"</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'agency:reviews' %}">Cancel</a>
    </form>
{% endblock %}
